name: Release Executable

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Nombre personalizado de versión (opcional, ej. v1.0.0)'
        required: false
        default: ''

jobs:
  release:
    name: Build & Publish Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Ejecutar Pruebas Automatizadas (QA)
        run: dotnet test tests/RecetarioAgrocalidad.Tests/RecetarioAgrocalidad.Tests.csproj -c Release

      - name: Compilar Ejecutable Autónomo (.exe Single-File)
        run: |
          dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist

      - name: Comprimir Ejecutable en Formato ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\Recetario_Agrocalidad.exe" -DestinationPath "dist\Recetario_Agrocalidad_win-x64.zip" -Force

      - name: Subir Artifact de Construcción (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: Recetario_Agrocalidad_win-x64
          path: dist/Recetario_Agrocalidad.exe
          retention-days: 7

      - name: Determinar Tag y Título de Versión
        id: get_tag
        shell: pwsh
        run: |
          $inputTag = "${{ github.event.inputs.tag_name }}"
          if ($inputTag -ne "") {
            $tag = $inputTag
            $title = "Versión $tag"
          } elseif ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
            $title = "Versión $tag"
          } else {
            $tag = "v1.0.${{ github.run_number }}"
            $title = "Versión $tag (Build Automático)"
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "title=$title" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publicar Release Oficial en GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: ${{ steps.get_tag.outputs.title }}
          files: |
            dist/Recetario_Agrocalidad.exe
            dist/Recetario_Agrocalidad_win-x64.zip
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
