[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vet-prescription-generator"
version = "2.0.0"
description = "Sistema de emisión, impresión instantánea y auditoría de recetas veterinarias (Agrocalidad Ecuador)."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Klever López", email = "lkleverjosue@gmail.com" }
]
license = { text = "PolyForm Noncommercial 1.0.0" }
keywords = ["veterinary", "prescription", "agrocalidad", "fastapi", "desktop", "python"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008", "W291"]
